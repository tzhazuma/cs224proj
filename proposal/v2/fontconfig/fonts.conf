<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- Local fontconfig for this paper only (exported by the Makefile as FONTCONFIG_FILE):
     system config + TeX Gyre fonts from the user's TeX Live, so fontspec finds "TeX Gyre Termes" by name. -->
<fontconfig>
  <include ignore_missing="yes">/etc/fonts/fonts.conf</include>
  <dir>~/.local/share/texlive/2026/texmf-dist/fonts/opentype/public/tex-gyre</dir>
  <cachedir>build/fccache</cachedir>
</fontconfig>
