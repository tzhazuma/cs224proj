<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- Local fontconfig for this deck only (exported by the Makefile as FONTCONFIG_FILE):
     system config + the Fira fonts shipped with the user's TeX Live, so metropolis finds "Fira Sans" by name. -->
<fontconfig>
  <include ignore_missing="yes">/etc/fonts/fonts.conf</include>
  <dir>~/.local/share/texlive/2026/texmf-dist/fonts/opentype/public/fira</dir>
  <cachedir>build/fccache</cachedir>
</fontconfig>
